<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F9FAFB" />
<title>Offline · FCPS Part 1 Simulator</title>
<style>
  :root { --emerald:#10B981; --cyan:#06B6D4; --bg:#F9FAFB; --text:#0F172A; --muted:#64748B; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  .card { max-width:380px; width:100%; }
  .badge {
    width:88px; height:88px; margin:0 auto 28px; border-radius:24px;
    background:#030712; display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 32px rgba(16,185,129,.22);
  }
  .badge span {
    font-family:Georgia,"Times New Roman",serif; font-size:46px; font-weight:700;
    background:linear-gradient(180deg,var(--emerald),var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1 { font-size:22px; line-height:1.3; margin:0 0 10px; letter-spacing:-.01em; }
  p { color:var(--muted); font-size:15px; line-height:1.6; margin:0 0 26px; }
  button {
    appearance:none; border:0; cursor:pointer; width:100%;
    padding:14px 22px; border-radius:14px; font-size:15px; font-weight:600;
    color:#fff; background:linear-gradient(135deg,var(--emerald),var(--cyan));
    box-shadow:0 6px 18px rgba(16,185,129,.32);
    -webkit-tap-highlight-color:transparent;
  }
  button:active { transform:translateY(1px); }
  .hint { margin-top:18px; font-size:13px; color:var(--muted); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#EF4444; margin-right:7px; vertical-align:middle; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span>F</span></div>
    <h1>You&rsquo;re offline</h1>
    <p>Your exam data is safe. Reconnect to the internet to continue your FCPS Part&nbsp;1 preparation.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="hint"><span class="dot"></span>No internet connection</div>
  </div>
  <script>
    addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
